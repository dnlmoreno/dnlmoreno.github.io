<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <!-- Ocean/Base gradient -->
    <linearGradient id="baseOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326" />
      <stop offset="50%" stop-color="#0a1a36" />
      <stop offset="100%" stop-color="#050e1f" />
    </linearGradient>

    <!-- Satellite grid lines pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 203, 226, 0.08)" stroke-width="0.75" />
    </pattern>

    <!-- Heatmap radial glows for pollution hotspots -->
    <radialGradient id="plumeCore1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ff7700" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#ffdd00" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="plumeCore2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4400" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ffaa00" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#002288" stop-opacity="0" />
    </radialGradient>

    <filter id="plumeBlur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Deep Blue Space/Ocean Background -->
  <rect width="480" height="270" fill="url(#baseOcean)" />
  <rect width="480" height="270" fill="url(#gridPattern)" />

  <!-- Coastline & Geography (US East Coast silhouette) -->
  <g fill="none" stroke="rgba(0, 203, 226, 0.35)" stroke-width="1.2">
    <!-- Great Lakes & Northern Borders -->
    <path d="M 40 40 Q 90 45, 140 35 T 220 50 T 320 30 T 400 20" stroke-dasharray="2 3" stroke="rgba(0, 203, 226, 0.2)" />
    <!-- US East Coast / Appalachian Line -->
    <path d="M 120 20 L 160 50 L 180 80 L 210 110 L 260 130 L 280 150 L 320 180 L 330 220 L 340 260" />
    <!-- Landmass Outlines & State borders -->
    <path d="M 80 80 Q 140 90, 190 75" stroke="rgba(0, 203, 226, 0.15)" />
    <path d="M 160 120 Q 220 135, 270 115" stroke="rgba(0, 203, 226, 0.15)" />
    <path d="M 210 160 Q 280 170, 310 150" stroke="rgba(0, 203, 226, 0.15)" />
    <path d="M 130 190 Q 200 205, 270 185" stroke="rgba(0, 203, 226, 0.15)" />
  </g>

  <!-- Atmospheric Plume Heatmap Layers (TEMPO NO2 observations) -->
  <g filter="url(#plumeBlur)">
    <!-- Broad background emissions corridor (I-95 corridor / Ohio Valley) -->
    <ellipse cx="230" cy="130" rx="140" ry="60" fill="url(#plumeCore2)" transform="rotate(-20 230 130)" />
    <ellipse cx="300" cy="160" rx="90" ry="40" fill="url(#plumeCore2)" transform="rotate(-35 300 160)" />

    <!-- Major Urban & Industrial Plume Hotspots -->
    <!-- Hotspot 1: Megalopolis (NY/NJ/PA) -->
    <ellipse cx="280" cy="120" rx="45" ry="30" fill="url(#plumeCore1)" />
    <circle cx="285" cy="115" r="16" fill="#ff2200" opacity="0.9" />
    <circle cx="287" cy="113" r="8" fill="#ffffff" opacity="0.8" />

    <!-- Hotspot 2: Ohio Valley / Industrial -->
    <ellipse cx="190" cy="135" rx="55" ry="32" fill="url(#plumeCore1)" />
    <circle cx="195" cy="138" r="18" fill="#ff3300" opacity="0.85" />
    <circle cx="197" cy="137" r="7" fill="#ffffaa" opacity="0.8" />

    <!-- Hotspot 3: South / Atlanta Corridor -->
    <ellipse cx="230" cy="190" rx="45" ry="25" fill="url(#plumeCore2)" />
    <circle cx="235" cy="190" r="12" fill="#ff5500" opacity="0.8" />

    <!-- Hotspot 4: Midwest / Great Lakes -->
    <ellipse cx="120" cy="95" rx="40" ry="25" fill="url(#plumeCore1)" />
    <circle cx="122" cy="94" r="14" fill="#ff3300" opacity="0.8" />
  </g>

  <!-- High-resolution sensor scanlines / swath overlay -->
  <g stroke="rgba(0, 229, 255, 0.3)" stroke-width="0.8">
    <line x1="20" y1="20" x2="40" y2="20" />
    <line x1="20" y1="20" x2="20" y2="40" />
    <line x1="460" y1="20" x2="440" y2="20" />
    <line x1="460" y1="20" x2="460" y2="40" />
    <line x1="20" y1="250" x2="40" y2="250" />
    <line x1="20" y1="250" x2="20" y2="230" />
    <line x1="460" y1="250" x2="440" y2="250" />
    <line x1="460" y1="250" x2="460" y2="230" />
  </g>

  <!-- Orbit sensor track info -->
  <text x="30" y="240" font-family="monospace" font-size="9" fill="#00e5ff" opacity="0.8">NASA TEMPO // NO2 COLUMN DENSITY</text>
  <text x="360" y="240" font-family="monospace" font-size="9" fill="#94a3b8" opacity="0.8">RES: 2.1 x 4.5 km</text>
</svg>
