<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="galCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#bff3ff" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#00cbe2" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00cbe2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="galDisk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8be9ff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#5fb8ec" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#5fb8ec" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="armFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9f9ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00cbe2" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Flattened disk glow (galaxy viewed at an angle) -->
  <ellipse cx="160" cy="160" rx="150" ry="58" fill="url(#galDisk)" transform="rotate(-18 160 160)" />

  <!-- Spiral arms -->
  <path
    d="M160 160 C 120 150, 70 120, 55 70 C 48 45, 60 20, 90 15"
    fill="none"
    stroke="url(#armFade)"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.8"
    transform="rotate(-18 160 160)"
  />
  <path
    d="M160 160 C 200 170, 250 198, 268 245 C 276 268, 266 292, 238 300"
    fill="none"
    stroke="url(#armFade)"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.65"
    transform="rotate(-18 160 160)"
  />
  <path
    d="M160 160 C 195 145, 240 115, 252 75"
    fill="none"
    stroke="url(#armFade)"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.45"
    transform="rotate(-18 160 160)"
  />

  <!-- Bright core -->
  <circle cx="160" cy="160" r="34" fill="url(#galCore)" />
  <circle cx="160" cy="160" r="7" fill="#ffffff" />

  <!-- Scattered stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="250" r="1.1" opacity="0.8" />
    <circle cx="70" cy="280" r="0.8" opacity="0.6" />
    <circle cx="260" cy="40" r="1" opacity="0.7" />
    <circle cx="290" cy="90" r="1.3" opacity="0.8" />
    <circle cx="20" cy="120" r="0.9" opacity="0.5" />
    <circle cx="230" cy="260" r="0.7" opacity="0.6" />
    <circle cx="300" cy="200" r="1" opacity="0.7" />
    <circle cx="100" cy="30" r="0.8" opacity="0.6" />
  </g>
</svg>
