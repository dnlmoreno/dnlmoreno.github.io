<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="plotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <!-- Point Glow Filter -->
    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Plot Canvas -->
  <rect width="480" height="270" fill="url(#plotBg)" rx="4" />

  <!-- Plot Axes Box -->
  <!-- Left: 90, Top: 30, Width: 340, Height: 180 -->
  <rect x="90" y="30" width="340" height="180" fill="#040812" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="3 3">
    <!-- Horizontal grids for Magnitude 16, 18, 20, 22 -->
    <line x1="90" y1="50" x2="430" y2="50" />
    <line x1="90" y1="95" x2="430" y2="95" />
    <line x1="90" y1="140" x2="430" y2="140" />
    <line x1="90" y1="185" x2="430" y2="185" />
    <!-- Vertical grids for Time 0, 50, 100, 150 -->
    <line x1="120" y1="30" x2="120" y2="210" />
    <line x1="205" y1="30" x2="205" y2="210" />
    <line x1="290" y1="30" x2="290" y2="210" />
    <line x1="375" y1="30" x2="375" y2="210" />
  </g>

  <!-- Axis Ticks & Labels -->
  <!-- Y-Axis (Magnitude) -->
  <text x="50" y="125" font-family="monospace" font-size="11" fill="#8b95a8" transform="rotate(-90 50 125)" text-anchor="middle">Magnitude</text>
  <g font-family="monospace" font-size="11" fill="#8b95a8" text-anchor="end">
    <text x="82" y="54">16</text>
    <text x="82" y="99">18</text>
    <text x="82" y="144">20</text>
    <text x="82" y="189">22</text>
  </g>

  <!-- X-Axis (Time in days) -->
  <text x="260" y="244" font-family="monospace" font-size="11" fill="#8b95a8" text-anchor="middle">Time (days)</text>
  <g font-family="monospace" font-size="11" fill="#8b95a8" text-anchor="middle">
    <text x="120" y="226">0</text>
    <text x="205" y="226">50</text>
    <text x="290" y="226">100</text>
    <text x="375" y="226">150</text>
  </g>

  <!-- Model Fit Curve (Continuous dashed line through data) -->
  <path d="M 105 180 Q 140 160, 170 70 Q 185 55, 200 75 Q 230 115, 270 145 Q 320 165, 370 172 Q 400 175, 420 176" 
        fill="none" stroke="rgba(0, 203, 226, 0.4)" stroke-width="1.8" stroke-dasharray="4 3" />

  <!-- Scatter Observations: Light Curve Data Points (g-band cyan, r-band white) -->
  <g filter="url(#pointGlow)">
    <!-- Rise Phase -->
    <circle cx="112" cy="178" r="2.8" fill="#38bdf8" />
    <circle cx="120" cy="170" r="2.8" fill="#ffffff" />
    <circle cx="132" cy="155" r="2.8" fill="#38bdf8" />
    <circle cx="140" cy="142" r="2.8" fill="#ffffff" />
    <circle cx="148" cy="120" r="2.8" fill="#38bdf8" />
    <circle cx="155" cy="102" r="2.8" fill="#ffffff" />
    <circle cx="162" cy="85" r="2.8" fill="#38bdf8" />
    <circle cx="168" cy="72" r="2.8" fill="#ffffff" />

    <!-- Peak Phase (around Day 35 - 45, mag ~ 16.5) -->
    <circle cx="174" cy="65" r="3.2" fill="#00e5ff" />
    <circle cx="180" cy="60" r="3.2" fill="#ffffff" />
    <circle cx="186" cy="62" r="3.2" fill="#00e5ff" />
    <circle cx="193" cy="68" r="3.2" fill="#ffffff" />
    <circle cx="200" cy="75" r="3.2" fill="#00e5ff" />

    <!-- Decline Phase -->
    <circle cx="210" cy="88" r="2.8" fill="#ffffff" />
    <circle cx="218" cy="100" r="2.8" fill="#38bdf8" />
    <circle cx="228" cy="112" r="2.8" fill="#ffffff" />
    <circle cx="236" cy="124" r="2.8" fill="#38bdf8" />
    <circle cx="248" cy="132" r="2.8" fill="#ffffff" />
    <circle cx="258" cy="140" r="2.8" fill="#38bdf8" />
    <circle cx="268" cy="145" r="2.8" fill="#ffffff" />
    <circle cx="280" cy="150" r="2.8" fill="#38bdf8" />
    <circle cx="292" cy="156" r="2.8" fill="#ffffff" />
    <circle cx="305" cy="160" r="2.8" fill="#38bdf8" />
    <circle cx="318" cy="164" r="2.8" fill="#ffffff" />
    <circle cx="332" cy="167" r="2.8" fill="#38bdf8" />
    <circle cx="346" cy="170" r="2.8" fill="#ffffff" />
    <circle cx="362" cy="172" r="2.8" fill="#38bdf8" />
    <circle cx="378" cy="173" r="2.8" fill="#ffffff" />
    <circle cx="395" cy="175" r="2.8" fill="#38bdf8" />
    <circle cx="412" cy="176" r="2.8" fill="#ffffff" />
  </g>

  <!-- Legend in top right corner of plot -->
  <g font-family="monospace" font-size="9" fill="#8b95a8">
    <circle cx="360" cy="48" r="2.5" fill="#38bdf8" />
    <text x="370" y="51">g-band</text>
    <circle cx="360" cy="62" r="2.5" fill="#ffffff" />
    <text x="370" y="65">r-band</text>
  </g>
</svg>
